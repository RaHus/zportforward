<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>devfwd ports</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --card: #ffffff; --text: #1c2026; --muted: #667080; --line: #e3e6eb;
    --accent: #2f6fed; --accent-text: #ffffff; --field: #ffffff;
    --up: #177a45; --up-bg: #e3f5ea; --idle: #5d6673; --idle-bg: #eceef2; --err: #b3261e; --err-bg: #fbe9e7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --card: #1c2027; --text: #e6e9ee; --muted: #98a2b3; --line: #2c323c;
      --accent: #6d9bff; --accent-text: #0e1116; --field: #14171c;
      --up: #6fd49a; --up-bg: #173524; --idle: #a3acba; --idle-bg: #2a2f38; --err: #ff9d94; --err-bg: #40201d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 920px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 15px; margin: 0; overflow-wrap: anywhere; }
  .muted { color: var(--muted); }
  .grow { flex: 1; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
  label.switch { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 16px; margin-bottom: 16px; }
  .card-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 4px; }
  .folder { margin: 0 0 12px; overflow-wrap: anywhere; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted);
       padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  td:last-child, th:last-child { padding-right: 0; text-align: right; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.up { color: var(--up); background: var(--up-bg); }
  .badge.idle { color: var(--idle); background: var(--idle-bg); }
  .badge.error { color: var(--err); background: var(--err-bg); }
  .why { color: var(--err); font-size: 12px; margin-top: 2px; }
  button, input { font: inherit; color: inherit; }
  button { border: 1px solid var(--line); background: transparent; border-radius: 6px;
           padding: 4px 10px; cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.primary:hover { filter: brightness(1.08); color: var(--accent-text); }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .detected { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; }
  form { display: flex; flex-wrap: wrap; align-items: end; gap: 10px; margin-top: 14px; }
  form label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
  input[type=number] { width: 150px; padding: 5px 8px; border: 1px solid var(--line);
                       border-radius: 6px; background: var(--field); }
  #notice { min-height: 22px; margin-bottom: 10px; }
  #notice.error { color: var(--err); }
  .empty { text-align: center; padding: 40px 16px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Forwarded ports</h1>
    <span class="muted" id="version"></span>
    <span class="grow"></span>
    <label class="switch" title="Forward ports that start listening later (below 32768)">
      <input type="checkbox" id="auto"> Forward new ports automatically
    </label>
  </header>
  <div id="notice" role="status" aria-live="polite"></div>
  <div id="containers"></div>
</main>
<script>
"use strict";
const EPHEMERAL = 32768;
const cards = new Map();
const root = document.getElementById("containers");
const notice = document.getElementById("notice");
const autoBox = document.getElementById("auto");
let noticeTimer = 0;

function el(tag, props, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value === true ? "" : value);
  }
  node.append(...children);
  return node;
}

function say(text, isError) {
  notice.textContent = text;
  notice.className = isError ? "error" : "";
  clearTimeout(noticeTimer);
  if (!isError) noticeTimer = setTimeout(() => { notice.textContent = ""; }, 4000);
}

async function api(path, body) {
  const options = body === undefined ? {} : {
    method: "POST",
    headers: { "content-type": "application/json", "x-devfwd": "1" },
    body: JSON.stringify(body),
  };
  const response = await fetch(path, options);
  const data = await response.json();
  if (data.error) throw new Error(data.error);
  return data;
}

async function act(path, body) {
  try {
    const data = await api(path, body);
    say(data.message || "Done");
    render(data);
  } catch (error) {
    say(error.message, true);
  }
}

function forwardRow(container, f) {
  const target = f.target_host ? f.target_host + ":" + f.port : String(f.port);
  const state = f.error ? "error" : f.listening ? "up" : "idle";
  const stateTitle = { up: "Something is listening on this port", idle: "Ready; nothing is listening yet", error: f.error }[state];
  const address = f.host_port
    ? el("a", { href: "http://127.0.0.1:" + f.host_port + "/", target: "_blank", rel: "noopener" }, "127.0.0.1:" + f.host_port)
    : "—";
  const source = { declared: "devcontainer.json", manual: "manual", auto: "auto" }[f.origin] || f.origin;
  const stateCell = el("td", {}, el("span", { class: "badge " + state, title: stateTitle }, state));
  if (f.error) stateCell.append(el("div", { class: "why" }, f.error));
  return el("tr", {},
    el("td", { class: "num mono" }, target),
    el("td", { class: "num mono" }, address),
    stateCell,
    el("td", { class: "muted" }, source),
    el("td", {}, f.label || ""),
    el("td", {}, el("button", {
      type: "button",
      "aria-label": "Stop forwarding port " + target,
      onclick: () => act("/api/stop", { container: container.id, port: f.port }),
    }, "Stop")));
}

function makeCard(container) {
  const status = el("span", { class: "muted" });
  const tbody = el("tbody");
  const table = el("table", {},
    el("thead", {}, el("tr", {},
      el("th", {}, "Container port"), el("th", {}, "Local address"), el("th", {}, "State"),
      el("th", {}, "Source"), el("th", {}, "Label"), el("th", {}, ""))),
    tbody);
  const none = el("p", { class: "muted" }, "No forwarded ports.");
  const detected = el("div", { class: "detected" });
  const port = el("input", { type: "number", min: "1", max: "65535", required: true, placeholder: "e.g. 5173" });
  const hostPort = el("input", { type: "number", min: "1", max: "65535", placeholder: "same number" });
  const form = el("form", {
    onsubmit: (event) => {
      event.preventDefault();
      const body = { container: container.id, port: Number(port.value) };
      if (hostPort.value) body.host_port = Number(hostPort.value);
      act("/api/forward", body).then(() => { port.value = ""; hostPort.value = ""; });
    },
  },
    el("label", {}, "Container port", port),
    el("label", {}, "Local port (optional)", hostPort),
    el("button", { type: "submit", class: "primary" }, "Forward"));
  const node = el("section", { class: "card" },
    el("div", { class: "card-head" }, el("h2", {}, container.name), status),
    el("p", { class: "folder muted mono" }, container.folder || ""),
    el("div", { class: "scroll" }, table), none, detected, form);
  return { node, status, tbody, table, none, detected };
}

function updateCard(card, container) {
  card.status.textContent = !container.running ? "stopped" : container.connected ? "" : "connecting…";
  card.tbody.replaceChildren(...container.forwards.map((f) => forwardRow(container, f)));
  card.table.hidden = container.forwards.length === 0;
  card.none.hidden = container.forwards.length !== 0;

  const visible = container.detected.filter((d) => d.port < EPHEMERAL);
  const hidden = container.detected.length - visible.length;
  const chips = visible.map((d) => el("button", {
    type: "button",
    title: d.loopback ? "Listening on the container's localhost only" : "Listening on all interfaces",
    "aria-label": "Forward port " + d.port,
    onclick: () => act("/api/forward", { container: container.id, port: d.port }),
  }, "+ " + d.port));
  const parts = [];
  if (chips.length) parts.push(el("span", { class: "muted" }, "Listening, not forwarded:"), ...chips);
  if (hidden) parts.push(el("span", { class: "muted" }, (chips.length ? "and " : "") + hidden + " ephemeral port" + (hidden === 1 ? "" : "s") + " not shown"));
  card.detected.replaceChildren(...parts);
  card.detected.hidden = parts.length === 0;
}

function render(data) {
  document.getElementById("version").textContent = "devfwd " + data.daemon.version;
  autoBox.checked = data.daemon.auto;
  const seen = new Set();
  for (const container of data.containers) {
    seen.add(container.id);
    let card = cards.get(container.id);
    if (!card) {
      card = makeCard(container);
      cards.set(container.id, card);
      root.append(card.node);
    }
    updateCard(card, container);
  }
  for (const [id, card] of cards) {
    if (!seen.has(id)) { card.node.remove(); cards.delete(id); }
  }
  let empty = document.getElementById("empty");
  if (data.containers.length === 0 && !empty) {
    root.append(el("p", { class: "empty muted", id: "empty" },
      "No running dev containers. Start one and it will appear here."));
  } else if (data.containers.length !== 0 && empty) {
    empty.remove();
  }
}

let failing = false;
async function refresh() {
  if (document.hidden) return;
  try {
    render(await api("/api/state"));
    if (failing) { failing = false; say("Reconnected"); }
  } catch (error) {
    failing = true;
    say("Cannot reach the devfwd daemon. Run `devfwd ui` to start it again.", true);
  }
}

autoBox.addEventListener("change", () => act("/api/auto", { on: autoBox.checked }));
document.addEventListener("visibilitychange", refresh);
setInterval(refresh, 2000);
refresh();
</script>
</body>
</html>
