[package]
name = "zportforward"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.6.8", features = ["derive"] }
zportforward-proto = { version = "0.1.1", path = "../proto" }
futures = "0.3.34"
interprocess = { version = "2.4.9", features = ["tokio"] }
jsonc-parser = { version = "0.34.0", features = ["serde"] }
rmcp = { version = "3.11.0", features = ["server", "transport-io", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
