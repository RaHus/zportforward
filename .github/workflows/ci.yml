name: ci
on:
  push:
  pull_request:

jobs:
  # The agent only ever runs on Linux; build it once and embed it everywhere.
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - name: Build agents
        run: |
          mkdir agents
          for arch in x86_64 aarch64; do
            target=$arch-unknown-linux-musl
            var=CARGO_TARGET_$(echo "$target" | tr 'a-z-' 'A-Z_')_LINKER
            env "$var=rust-lld" cargo build --release -p devfwd-agent --target "$target"
            cp "target/$target/release/devfwd-agent" "agents/devfwd-agent-$arch"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: agents
          path: agents

  build:
    needs: agent
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, e2e: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: agents
          path: agents
      - name: Point the build at the prebuilt agents
        shell: bash
        run: echo "DEVFWD_AGENT_DIR=$PWD/agents" >> "$GITHUB_ENV"
      - run: cargo test --workspace
      - run: cargo build --release -p devfwd --target ${{ matrix.target }}
      - name: End-to-end
        if: matrix.e2e
        run: |
          tests/e2e/run.sh target/${{ matrix.target }}/release/devfwd
          tests/e2e/multi.sh target/${{ matrix.target }}/release/devfwd
      - uses: actions/upload-artifact@v4
        with:
          name: devfwd-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/devfwd
            target/${{ matrix.target }}/release/devfwd.exe

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - run: cargo build --release --target wasm32-wasip2
        working-directory: zed-extension
